# Configuración de la base de datos MySQL para XAMPP
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/tiendadb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Contraseña para MySQL - usando la contraseña correcta 'admin'
spring.datasource.password=admin
# Driver para MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Propiedades adicionales para forzar el uso de la contraseña
spring.datasource.hikari.username=root
spring.datasource.hikari.password=admin

# Configuración de pool de conexiones Hikari
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-test-query=SELECT 1

# Configuración de Hibernate
# Especificar el dialecto explícitamente para evitar problemas de detección
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de inicialización de datos
# Usar 'update' para mantener la estructura de la base de datos pero actualizar el esquema si es necesario
spring.jpa.hibernate.ddl-auto=update
# Desactivar inicialización de datos para no interferir con datos existentes
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Configuración de logging para depurar problemas de conexión
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# JWT
jwt.secret=miClaveSecretaParaTiendaOnlineDebeSerLoBastanteLargaParaSerSegura
jwt.expiration-ms=86400000

# Puerto del servidor
server.port=8080

